name: training-log

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: training-log:latest
    restart: unless-stopped

    environment:
      # Signs the session cookie the flash messages ride in. Required: the
      # container sets APP_ENV=production, and create_app refuses to start on
      # the dev key baked into the source. Put a real value in .env — see
      # .env.example — and keep that file out of git.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env, see .env.example}
      # Turn on once a TLS-terminating proxy sits in front: a cookie marked
      # Secure is dropped over plain HTTP, and the flashes would vanish.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}

    ports:
      # Bound to the loopback interface, NOT 0.0.0.0. The app has no login of
      # any kind — anyone who can reach the port can read and change everyone's
      # data — so it must not be published to the network by accident. Reach it
      # from elsewhere only through a reverse proxy that authenticates first.
      - "127.0.0.1:8000:8000"

    volumes:
      # The only writable path. A named volume rather than a bind mount, so it
      # inherits the app user's ownership from the image instead of the host
      # uid that happens to own the directory.
      - db:/app/instance

    # Nothing outside /app/instance and /tmp may be written, so a flaw that
    # reaches the filesystem cannot leave anything behind that the next request
    # would run.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m,nodev,nosuid,noexec

    # The process is already non-root (USER app in the image). These make sure
    # it cannot become root: no setuid binary can raise privileges, and every
    # Linux capability is dropped — binding :8000 as a non-root user needs
    # none of them.
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Caps on what a runaway or wedged container can take from the host.
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://127.0.0.1:8000/create', timeout=4).read(1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db:
