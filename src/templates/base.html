<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Training Log{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <span class="wordmark">Training Log</span>
    <nav>
      <a href="{{ url_for('main.create') }}" {% if request.endpoint == 'main.create' %}class="active"{% endif %}>Create workout</a>
      <a href="{{ url_for('main.track') }}" {% if request.endpoint == 'main.track' %}class="active"{% endif %}>Track session</a>
      <a href="{{ url_for('main.analytics') }}" {% if request.endpoint == 'main.analytics' %}class="active"{% endif %}>Analytics</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash flash-{{ category }}">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
